<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <style>html,body{margin:0;overflow:hidden;background:#222}</style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x88aacc);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(5, 10, 4);
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: 0x7a8f6a }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const url = new URLSearchParams(location.search).get('m') || 'Casual_Male';
  const clipName = new URLSearchParams(location.search).get('c') || 'Walk';
  const gltf = await new GLTFLoader().loadAsync(`assets/models/Humans/${url}.gltf`);
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = gltf.animations.find(a => a.name === clipName);
  window.__clips = gltf.animations.map(a => a.name);
  if (clip) mixer.clipAction(clip).play();

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    mixer.update(clock.getDelta());
    const cfg = window.__camCfg || { dist: 3.2, h: 1.0, lookY: 0.8 };
    camera.position.set(cfg.dist, cfg.h, cfg.dist * 0.3);
    camera.lookAt(0, cfg.lookY, 0);
    renderer.render(scene, camera);
  });
  window.__ready = true;
  window.__scene = scene;
  window.__THREE = THREE;
  window.__mixer = mixer;
</script>
</body>
</html>
