<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Walk test</title>
  <style>html,body{margin:0;overflow:hidden;background:#222}</style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { buildVisitors } from '../js/environment/Visitors.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x88aacc);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -120;
  sun.shadow.camera.right = sun.shadow.camera.top = 120;
  sun.shadow.camera.far = 200;
  scene.add(sun);

  // 1 m grid stripes so foot slide is visible between frames.
  const cnv = document.createElement('canvas');
  cnv.width = cnv.height = 512;
  const ctx = cnv.getContext('2d');
  ctx.fillStyle = '#7a8f6a'; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#39482f'; ctx.lineWidth = 6;
  for (let i = 0; i <= 8; i++) {
    ctx.beginPath(); ctx.moveTo(i * 64, 0); ctx.lineTo(i * 64, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * 64); ctx.lineTo(512, i * 64); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cnv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(25, 25); // 8 cells / 512px, plane 200 → 1 m cells
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshLambertMaterial({ map: tex })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const visitors = await buildVisitors({ count: 4, obstacles: [], coasterFootprint: null, bridge: null });
  scene.add(visitors);
  const vis = visitors.userData.visitors[0];
  window.__vis = vis;
  window.__ready = true;

  const clock = new THREE.Clock();
  let time = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    visitors.userData.tick(dt, time);
    // side-on tracking camera on visitor 0
    const p = vis.root.position, h = vis.heading;
    const sx = Math.cos(h), sz = -Math.sin(h);
    camera.position.set(p.x + sx * 5.5, p.y + 1.3, p.z + sz * 5.5);
    camera.lookAt(p.x, p.y + 1.1, p.z);
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
