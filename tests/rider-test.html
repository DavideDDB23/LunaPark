<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <style>html,body{margin:0;overflow:hidden;background:#222}</style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { loadVisitorTemplates, makeRider, updateRider } from '../js/environment/Passengers.js';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x88aacc);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.3));
  const sun = new THREE.DirectionalLight(0xffffff, 1.8);
  sun.position.set(6, 10, 5);
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x7a8f6a }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const H = 3.28;
  const templates = await loadVisitorTemplates(3);
  const riders = [];

  // 1) chair-seated on a box bench
  const bench = new THREE.Mesh(new THREE.BoxGeometry(2, 1.0, 1.2), new THREE.MeshLambertMaterial({ color: 0x8a6a4a }));
  bench.position.set(-3, 0.5, 0);
  scene.add(bench);
  const seated = makeRider(templates[0], H, { pool: ['rest'], facingY: 0, phase: 0 });
  seated.pivot.position.set(-3, 1.0 - H * 0.28, 0);
  scene.add(seated.pivot);
  riders.push(seated);

  // 2) standing
  const standing = makeRider(templates[1 % templates.length], H, { pool: ['standRest'], facingY: 0, phase: 1, standing: true });
  standing.pivot.position.set(0, 0, 0);
  scene.add(standing.pivot);
  riders.push(standing);

  // 3) horse-seated
  const horse = makeRider(templates[2 % templates.length], H, { pool: ['rest'], facingY: 0, phase: 2, seatedStyle: 'horse' });
  horse.pivot.position.set(3, 1.0 - H * 0.28, 0);
  scene.add(horse.pivot);
  riders.push(horse);

  window.__ready = true;
  const clock = new THREE.Clock();
  let time = 0;
  renderer.setAnimationLoop(() => {
    time += Math.min(clock.getDelta(), 0.05);
    for (const r of riders) updateRider(r, time + r.phase);
    const cfg = window.__camCfg || { x: 0, y: 2.2, z: 9, tx: 0, ty: 1.2, tz: 0 };
    camera.position.set(cfg.x, cfg.y, cfg.z);
    camera.lookAt(cfg.tx, cfg.ty, cfg.tz);
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
